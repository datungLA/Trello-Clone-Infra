include /etc/nginx/cloudflare-realip.conf;
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name trello.learnvibecode.online trello-app.learnvibecode.online trello-admin.learnvibecode.online;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name trello-app.learnvibecode.online trello-admin.learnvibecode.online;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    location = / {
        if ($host = trello-admin.learnvibecode.online) { return 302 /admin; }
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
server {
    listen 443 ssl;
    server_name trello.learnvibecode.online;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
    }
}
