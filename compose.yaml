name: trello-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trello
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U trello -d trello]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 192m
    shm_size: 64m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 48mb, --maxmemory-policy, noeviction, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 80m
    restart: unless-stopped

  api:
    image: trello-clone-api:${RELEASE_TAG:-dev}
    build: ../Trello-Clone-Backend
    labels:
      com.trello.release: ${RELEASE_TAG:-dev}
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://trello:${POSTGRES_PASSWORD}@postgres:5432/trello
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEV_MAIL_DIR: /app/dev-mail
    volumes:
      - dev-mail:/app/dev-mail
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 224m
    restart: unless-stopped

  web:
    image: trello-clone-web:${RELEASE_TAG:-dev}
    build: ../Trello-Clone-Frontend
    labels:
      com.trello.release: ${RELEASE_TAG:-dev}
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

  landing:
    image: trello-clone-landing:${RELEASE_TAG:-dev}
    profiles: [landing]
    build:
      context: ../Trello-Clone-Frontend/landing
      args:
        APP_URL: ${APP_ORIGIN:-http://localhost:8080}
        SITE_URL: ${LANDING_ORIGIN:-http://localhost:8081}
    labels:
      com.trello.release: ${RELEASE_TAG:-dev}
    ports:
      - 127.0.0.1:${LANDING_PORT:-8081}:80
    mem_limit: 32m
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: [media]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trello-media}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:9001:9001
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  dev-mail:
  minio-data:
